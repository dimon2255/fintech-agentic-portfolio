[project]
name = "fintech-agentic-portfolio"
version = "0.1.0"
description = "Agentic AI portfolio for fintech fraud detection and KYC/AML compliance"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=1.4.0",  # src/llm.py passes effort=, a first-class field in 1.4.0
    "pydantic>=2.0.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
# Golden-set evaluation harness tests and the rules-tier ratchet gate (docs/adr/001).
testpaths = ["evals/tests"]
pythonpath = ["."]
